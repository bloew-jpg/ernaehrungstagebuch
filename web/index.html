<!DOCTYPE html>
<html>
<head>
  <!-- DIAGNOSE-START (temporaer) -->
  <script>
    (function () {
      var box;
      function get() {
        if (box) return box;
        box = document.createElement('pre');
        box.id = 'diag-box';
        box.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:2147483647;margin:0;padding:12px;background:#fff;color:#b00020;font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-all;max-height:100%;overflow:auto';
        box.textContent = 'Diagnose l\u00e4uft \u2013 Flutter wird geladen \u2026\n';
        (document.body || document.documentElement).appendChild(box);
        return box;
      }
      function add(s) { get().textContent += s + '\n'; }
      window.__diagAdd = add;
      window.onerror = function (msg, src, line, col, err) {
        add('FEHLER: ' + msg + '\nQuelle: ' + src + '\nZeile/Spalte: ' + line + ':' + col + (err && err.stack ? '\nStack: ' + err.stack : ''));
      };
      window.onunhandledrejection = function (e) {
        var r = e && e.reason;
        add('UNHANDLED REJECTION: ' + (r && r.message ? r.message : String(r)) + (r && r.stack ? '\nStack: ' + r.stack : ''));
      };
      var oe = console.error;
      console.error = function () {
        try { add('console.error: ' + Array.prototype.slice.call(arguments).join(' ')); } catch (x) {}
        if (oe) oe.apply(console, arguments);
      };
      document.addEventListener('DOMContentLoaded', get);
      var n = 0;
      var iv = setInterval(function () {
        n++;
        if (document.querySelector('flt-glass-pane')) {
          clearInterval(iv);
          setTimeout(function () { if (box && box.parentNode) box.parentNode.removeChild(box); }, 1500);
        } else if (n === 20) {
          add('Hinweis: nach 10 s ist Flutter noch nicht gestartet.');
        }
      }, 500);
    })();
  </script>
  <!-- DIAGNOSE-END -->
